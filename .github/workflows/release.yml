name: Build APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version (semver)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?(\+([0-9A-Za-z.-]+))?$'
            if ! [[ "$TAG" =~ $SEMVER_RE ]]; then
              echo "::error::Tag「$TAG」不符合 semver，正确格式：v1.2.3 或 v1.2.3-beta.1"
              exit 1
            fi
            VERSION="${TAG#v}"
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH="${PATCH%%-*}"
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            # 手动触发：开发版本，不校验 semver
            VERSION="0.0.0-dev.${RUN_NUMBER}"
            CODE=$((100000000 + RUN_NUMBER))
          fi
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionName=$VERSION versionCode=$CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runner 自带 Android SDK（ANDROID_HOME + 已接受 license），
      # 缺失的 platforms/build-tools 由 AGP 自动下载，无需 setup-android

      - name: Cache Android SDK components
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-34
            /usr/local/lib/android/sdk/build-tools/34.0.0
          key: android-sdk-${{ runner.os }}-api34-bt34.0.0

      - name: Install Android SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)"
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # setup-gradle 默认缓存 ~/.gradle（依赖 + 配置缓存），首次之后构建显著提速
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing/keystore.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/signing/keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置签名密钥 Secrets（SIGNING_KEYSTORE 等），将使用临时 debug 密钥，无法覆盖安装"
          fi

      - name: Build APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ env.KEYSTORE_FILE }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionName="$VERSION" -PversionCode="$CODE" --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GarminSync-${VERSION}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GarminSync-*.apk
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: GarminSync-${{ env.VERSION }}
          path: dist/GarminSync-*.apk
